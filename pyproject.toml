[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-energy-hvac-telemetry-pipeline"
# Single source of truth is telemetry_pipeline.__version__ (the API advertises it too).
dynamic = ["version"]
description = "Modular building energy & HVAC telemetry pipeline with daily reporting and a FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "matplotlib>=3.8,<4",
    # IANA zone database for building-local report days (ADR 0006); zoneinfo
    # needs it on platforms without a system tz database (e.g. Windows).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109,<1",
    "uvicorn>=0.27,<1",
]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
    "httpx>=0.26,<1",
    "ruff>=0.2,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
telemetry-pipeline = "telemetry_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "telemetry_pipeline.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_data: runs the pipeline on the vendored Limassol files (~3 s); deselect with -m 'not real_data'",
]

[tool.coverage.run]
source = ["telemetry_pipeline"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented dependency-injection idiom requires Query()/Path()
# calls as argument defaults; B008 is a false positive there.
"src/telemetry_pipeline/api/*.py" = ["B008"]

[tool.mypy]
# No python_version pin: mypy parses installed stubs with the target grammar, and
# numpy >= 2.5 (pulled in by matplotlib on Python >= 3.12) ships stubs that use
# PEP 695 `type` statements, which a 3.11 grammar rejects. The CI matrix runs mypy
# on 3.11 itself, so 3.11 compatibility is still checked where it is real.
strict = true
mypy_path = "src"
packages = ["telemetry_pipeline"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
